[package]
name = "para/api"
version = "0.1.3"
# The minimum noeta this package works with; enforced at resolve time from noeta 0.2.1 on.
toolchain = ">=0.2"
license = "MIT OR Apache-2.0"
description = "An HTTP client layer with middleware, mocking, pagination, and an @openapi directive that generates a typed client from a spec."
keywords = ["api", "http", "openapi", "rest", "web"]
# This package ships a native Rust extension crate: the `@openapi` directive's compile-time
# expansion hook (which reads a spec file — something no Noeta code can do at compile time) and the
# `para.api.url` percent-encoder its generated query strings are built with. A consumer must
# authorize it under `[trust] native = ["para/api"]`.
#
# The composition layer itself — the middleware onion, the standard layers, the pagination
# strategies — is deliberately NOT native: it invokes user code, and a native client holding user
# closures as arena ids was tried once and leaked. See `plans/http/para-api-handoff.md`.
native = "native"
