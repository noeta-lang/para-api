[package]
name = "noeta-para-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noeta-lang/para-api"
rust-version = "1.95"

[dependencies]
# The extension ABI — this crate's entire reason to exist is `ExtDirective::expand`, the
# compile-time codegen hook. It registers no modules and no types: `para/api`'s runtime surface is
# pure Noeta (`api.noe`, `middleware.noe`, `pagination.noe`), and deliberately stays that way.
#
# The CONTRACT crate, from crates.io. A range, not an exact version: a patch toolchain release does
# not change the contract, so it must not cost this manifest an edit. Composition redirects it onto
# the consumer's own toolchain whatever is written here (`[patch.crates-io]`), so the range governs
# this repo's CI, not consumers.
noeta-ext-abi = "0.5"
# OpenAPI documents are JSON. Parsed as an untyped `Value` tree rather than through derived structs
# because a spec is mostly optional keys and vendor extensions: a strict deserialize would reject
# real-world documents over fields the generator never looks at.
serde_json = "1"

[dev-dependencies]
# The expansion tests drive a real link, so they exercise the same path the compiler takes rather
# than calling the hook directly (which would prove only that the hook returns a string).
#
# These are compiler INTERNALS — unpublished (`publish = false` since noeta 0.5), carrying no
# stability promise — so they stay git pins on the exact toolchain release this package version is
# proven against, and the `[patch]` below folds their copy of the contract crate onto the published
# one this crate compiles against.
noeta-loader = { git = "https://github.com/noeta-lang/noeta", tag = "v0.5.0" }
noeta-lexer = { git = "https://github.com/noeta-lang/noeta", tag = "v0.5.0" }
noeta-ast = { git = "https://github.com/noeta-lang/noeta", tag = "v0.5.0" }
# `install_with_extras` — composing this extension with the std units, which has to happen before
# any registry lookup and therefore once per test binary.
noeta-stdlib = { git = "https://github.com/noeta-lang/noeta", tag = "v0.5.0" }
# The placement gate belongs to the checker, not the loader, so proving it requires running it.
noeta-check = { git = "https://github.com/noeta-lang/noeta", tag = "v0.5.0" }

# ONE copy of the extension ABI in this crate's dependency graph. The real dependency is the
# published `noeta-ext-abi = "0.5"`; the git-pinned dev-dependencies above carry their own
# path-and-version dependency on it, resolved from the git source — a SECOND copy, whose
# `dyn Extension` is a different type, so `install_with_extras(&[&ParaApiExtension])` in
# `tests/expansion.rs` would not type-check ("multiple different versions of crate `noeta_ext_abi`").
# Patching the git source to the published version collapses the two. It is the same one-copy rule
# the composer enforces for a consumer (`compose.rs::toolchain_patch_section` emits both patch
# tables), reached here through the door this repo's own test build opens.
[patch."https://github.com/noeta-lang/noeta"]
noeta-ext-abi = "0.5"

# Inlined from the monorepo's `[workspace.lints]` — this crate is its own workspace root now.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
